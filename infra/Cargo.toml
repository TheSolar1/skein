[package]
name = "skein"
version = "0.1.0"
edition = "2021"
description = "Encrypted mesh networking: own addresses, routing, .skein names, bulk file transfer over UDP (LoRa/BLE adapters planned)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util"] }
axum = "0.7"
async-trait = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
blake3 = "1"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
tokio-serial = "5"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
lto = true
strip = true
